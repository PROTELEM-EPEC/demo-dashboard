<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rediseño del mail — versión rediseñada</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;background:#eeece7;font-family:Arial,Helvetica,sans-serif;
  display:flex;align-items:center;justify-content:center}
.tarjeta{background:#fff;border-radius:12px;border-top:4px solid #1b6b3a;
  box-shadow:0 8px 30px rgba(0,0,0,.12);padding:40px;max-width:420px;width:calc(100% - 32px)}
h1{margin:0 0 8px;font-size:21px;color:#12321f}
p.nota{margin:0 0 24px;color:#555;font-size:14px;line-height:1.4}
label{display:block;font-size:12px;letter-spacing:.04em;color:#777;margin-bottom:6px;text-transform:uppercase}
input[type=password]{width:100%;padding:12px 14px;border:2px solid #1b6b3a;border-radius:8px;
  font-size:16px;margin-bottom:16px}
button{width:100%;padding:12px 14px;background:#1b6b3a;color:#fff;border:0;border-radius:8px;
  font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.error{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
#visor{display:none;width:100vw;height:100vh;background:#111}
#visor img{width:100%;height:100%;object-fit:contain;display:block}
body.desbloqueado{display:block}
body.desbloqueado .tarjeta{display:none}
body.desbloqueado #visor{display:block}
</style>
</head>
<body>
<div class="tarjeta">
  <h1>Rediseño del mail — versión rediseñada</h1>
  <p class="nota">Contenido cifrado: hace falta la contraseña para verlo en tu navegador.</p>
  <form id="formulario">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" autocomplete="current-password" autofocus>
    <button id="entrar" type="submit">Ver la factura</button>
    <p class="error" id="error"></p>
  </form>
</div>
<div id="visor"><img id="img" alt="Rediseño del mail — versión rediseñada"></div>

function deBase64(texto) {
  var binario = atob(texto);
  var bytes = new Uint8Array(binario.length);
  for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
  return bytes;
}

var formulario = document.getElementById('formulario');
var entradaClave = document.getElementById('clave');
var botonEntrar = document.getElementById('entrar');
var error = document.getElementById('error');
var img = document.getElementById('img');

formulario.addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle) {
    error.textContent = 'Este navegador no expone WebCrypto (hace falta https).';
    return;
  }
  botonEntrar.disabled = true;
  entradaClave.disabled = true;
  error.textContent = '';
  try {
    var material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(entradaClave.value), 'PBKDF2', false, ['deriveKey']);
    var clave = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: deBase64(PAQUETE.kdf.sal),
         iterations: PAQUETE.kdf.iteraciones, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plano = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: deBase64(PAQUETE.iv) }, clave, deBase64(PAQUETE.datos));
    var blob = new Blob([plano], { type: 'image/png' });
    img.src = URL.createObjectURL(blob);
    document.body.classList.add('desbloqueado');
  } catch (err) {
    botonEntrar.disabled = false;
    entradaClave.disabled = false;
    entradaClave.value = '';
    entradaClave.focus();
    error.textContent = 'Contraseña incorrecta.';
  }
});
</script>
